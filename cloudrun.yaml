apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: campusconnect
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/campusconnect:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: production
        - name: GEMINI_MODEL
          value: gemini-2.5-flash-lite
        - name: GEMINI_API_KEY
          value: "YOUR_GOOGLE_AI_STUDIO_KEY"
