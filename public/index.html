<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9999px;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px 0;
      color: #1e40af;
      font-size: 32px;
    }
    p {
      color: #64748b;
      max-width: 500px;
      line-height: 1.6;
    }
    .links {
      margin-top: 24px;
      display: flex;
      gap: 16px;
    }
    a {
      color: #1e40af;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <span class="badge">CampusConnect Infrastructure</span>
  <h1>From Campus Complaints to Accountable Action</h1>
  <p>CampusConnect facility issue reporting and resolution platform. Cloud Functions API backend is operational.</p>
  <div class="links">
    <a href="/api/health">API Health</a>
    <a href="/healthz">Liveness Probe</a>
    <a href="/readyz">Readiness Probe</a>
    <a href="/auth-test">Auth Diagnostic</a>
  </div>

</html>
